<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reisblik – Mijn reisdag</title>
<style>
body{margin:0;background:#f3f0e8;color:#17384a;font-family:Arial,sans-serif;}
.page{max-width:1000px;margin:28px auto;padding:0 20px;}
.header{background:#26353a;color:#fff;border-radius:12px;padding:18px 20px;}
.header h1{margin:0;font-size:28px;}
.version{font-size:13px;font-weight:normal;opacity:.8;margin-left:8px;}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.nav button{background:#26353a;color:#fff;border:0;border-radius:9px;padding:10px 15px;font-size:15px;font-weight:600;cursor:pointer;}
.card{background:#fff;border:1px solid #cfd8dc;border-radius:12px;padding:22px;margin-top:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.card h2{margin-top:0;}
.note{color:#61747d;line-height:1.5;}
.docx-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.docx-row input[type=file]{font-size:15px;max-width:100%;}
.docx-button{background:#26353a;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;}
.docx-button:disabled{opacity:.55;cursor:not-allowed;}
.docx-status{font-size:13px;color:#61747d;}
</style>
</head>
<body>
<div class="page">
<div class="header"><h1>📖 Mijn reisdag <span class="version">Reisblik 9.9.51</span></h1></div>
<div class="nav"><button type="button" id="backStartBtn">← Terug naar startscherm</button><button type="button" id="backAppBtn">← Terug naar Reisblik</button></div>
<div class="card"><h2>📝 DOCX → HTML per dag</h2><p class="note">Kies hier het DOCX-bestand van een reisdag en maak daarvan de Reisblik-HTML.</p><div class="docx-row"><input id="docxFileInput" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><button type="button" class="docx-button" id="docxHtmlDagBtn" disabled>HTML aanmaken</button><span id="docxFileStatus" class="docx-status"></span></div></div>
<div class="card"><h2>Mijn reisdag</h2><p class="note">Deze pagina is nu de vaste plek voor de functies van Mijn reisdag.</p></div>
</div>
<script src="js/docx-html.js?v=9.9.51"></script>
<script>document.getElementById('backStartBtn').addEventListener('click',()=>{location.href='index.html';});document.getElementById('backAppBtn').addEventListener('click',()=>{location.href='app.html#open';});</script>
</body>
</html>
